name: Claude Code Task

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  workflows: write

jobs:
  run-claude:
    if: contains(github.event.issue.title, '[claude-task]') && github.event.issue.user.login == 'cymzysjd2t-prog'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Claude Code
        uses: pleaseai/setup-claude-code@v1.1.4

      - name: Configure git
        run: |
          git config user.name "claude-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Run Claude Code task
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TASK_PROMPT: ${{ github.event.issue.body }}
        run: |
          claude -p "$TASK_PROMPT" --dangerously-skip-permissions

      - name: Commit and push changes
        run: |
          git add -A
          git diff --cached --quiet || git commit -m "chore: tâche automatique via Claude (issue #${{ github.event.issue.number }})"
          git push

      - name: Comment on issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "✅ Tâche traitée par Claude Code. Vérifie les commits sur `main`."
            })
