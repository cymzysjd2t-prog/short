name: Publish Daily YouTube Short

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Install ffmpeg & fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS }}
          YOUTUBE_CATEGORY_ID: ${{ secrets.YOUTUBE_CATEGORY_ID }}
          CHANNEL_NICHE: ${{ secrets.CHANNEL_NICHE }}
          CHANNEL_TONE: ${{ secrets.CHANNEL_TONE }}
          CHANNEL_LANGUAGE: ${{ secrets.CHANNEL_LANGUAGE }}
        run: npm run publish

      - name: Commit updated topics & history
        run: |
          git config user.name "youtube-shorts-autopilot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/topics.json data/history.json
          git diff --cached --quiet || git commit -m "chore: mise à jour automatique des données (run ${{ github.run_id }})"
          git push
