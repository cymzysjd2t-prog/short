name: Publish Daily YouTube Short (Kids)

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Install ffmpeg & fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install edge-tts (repli gratuit si ElevenLabs est à court de crédits)
        run: pip install edge-tts

      - name: Run kids pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          KIDS_ELEVENLABS_VOICE_ID: ${{ secrets.KIDS_ELEVENLABS_VOICE_ID }}
          KIDS_EDGE_TTS_VOICE: ${{ secrets.KIDS_EDGE_TTS_VOICE }}
          KIDS_YOUTUBE_CLIENT_ID: ${{ secrets.KIDS_YOUTUBE_CLIENT_ID }}
          KIDS_YOUTUBE_CLIENT_SECRET: ${{ secrets.KIDS_YOUTUBE_CLIENT_SECRET }}
          KIDS_YOUTUBE_REFRESH_TOKEN: ${{ secrets.KIDS_YOUTUBE_REFRESH_TOKEN }}
          KIDS_YOUTUBE_PRIVACY_STATUS: ${{ secrets.KIDS_YOUTUBE_PRIVACY_STATUS }}
          KIDS_YOUTUBE_CATEGORY_ID: ${{ secrets.KIDS_YOUTUBE_CATEGORY_ID }}
          KIDS_CHANNEL_NICHE: ${{ secrets.KIDS_CHANNEL_NICHE }}
          KIDS_CHANNEL_TONE: ${{ secrets.KIDS_CHANNEL_TONE }}
          KIDS_CHANNEL_LANGUAGE: ${{ secrets.KIDS_CHANNEL_LANGUAGE }}
        run: npm run publish:kids

      - name: Commit updated topics & history (kids)
        run: |
          git config user.name "youtube-shorts-autopilot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/topics-kids.json data/history-kids.json
          git diff --cached --quiet || git commit -m "chore: mise à jour automatique des données enfants (run ${{ github.run_id }})"
          git pull --rebase origin main
          git push
